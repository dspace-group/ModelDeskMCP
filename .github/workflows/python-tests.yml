name: Python tests

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Install project and dev dependencies
        shell: pwsh
        run: uv sync --extra dev

      - name: Validate launcher metadata entry points
        shell: pwsh
        run: |
          .\ModelDeskMCP.cmd --version

          $toolOutput = .\ModelDeskMCP.cmd --list-tools
          $toolLines = $toolOutput -split "`r?`n" |
            Where-Object { $_ -match '^\s*modeldesk_' } |
            ForEach-Object { $_.Trim() } |
            Where-Object { $_ -ne '' }
          if ($toolLines.Count -ne 83) {
            throw "Expected 83 modeldesk_ tool lines, got $($toolLines.Count)."
          }

          $resources = .\ModelDeskMCP.cmd --list-resources
          if ($resources.Trim() -ne 'No MCP resources are registered.') {
            throw "Unexpected resource output: $resources"
          }

          $prompts = .\ModelDeskMCP.cmd --list-prompts
          if ($prompts.Trim() -ne 'No MCP prompts are registered.') {
            throw "Unexpected prompt output: $prompts"
          }

      - name: Syntax validation
        shell: pwsh
        run: |
          uv run python -m compileall src server.py

      - name: Run deterministic tests
        shell: pwsh
        run: |
          uv run pytest

      - name: Smoke check without live COM
        shell: pwsh
        run: |
          uv run python -m modeldesk_mcp.smoke --skip-com-status
